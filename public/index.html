.video .vc { color: var(--text-muted); font-size: 12.5px; }

/* previsões */
.fc-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.fc-table th { text-align: left; color: var(--text-muted); font-weight: 500; padding: 6px 8px; border-bottom: 1px solid var(--border); }
.fc-table td { padding: 8px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
.fc-table td.r, .fc-table th.r { text-align: right; }
.err-good { color: #5fdc7b; } .err-bad { color: #ff8a6b; }

.method { color: var(--text-muted); font-size: 13px; line-height: 1.7; max-width: 100ch; }
.method p { margin: 0 0 8px; }
.method b { color: var(--text-secondary); }
.notices { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.author { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-top: 12px; }
.author .who2 { display: flex; align-items: center; gap: 14px; }
.author .mono { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: #1a0b12; background: linear-gradient(135deg, var(--sun-1), var(--sun-2) 55%, var(--sun-3)); }
.author .nm { font-weight: 700; } .author .rl { color: var(--text-muted); font-size: 12.5px; }
footer { padding: 30px 0 60px; color: var(--text-muted); font-size: 12.5px; }
footer a { color: var(--text-secondary); }

/* cartão para o LinkedIn (1080×1350) */
.modal { position: fixed; inset: 0; background: rgba(5,4,9,.82); backdrop-filter: blur(8px); z-index: 50; display: none; align-items: center; justify-content: center; padding: 20px; }
.modal.open { display: flex; }
.modal-inner { display: flex; flex-direction: column; gap: 12px; align-items: center; max-height: 100%; }
.modal-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.card-scale { width: min(90vw, calc((100vh - 120px) * .8)); aspect-ratio: 4/5; position: relative; }
#shareCard { width: 1080px; height: 1350px; transform-origin: top left; position: absolute; top: 0; left: 0;
  background: #0d0b14; color: var(--text-primary); padding: 64px 76px 56px; display: flex; flex-direction: column; overflow: hidden; font-family: var(--sans); }
#shareCard::before { content: ''; position: absolute; inset: 0; background: radial-gradient(60% 40% at 85% 8%, rgba(255,79,154,.35), transparent 70%), radial-gradient(50% 35% at 5% 0%, rgba(108,75,255,.3), transparent 70%), radial-gradient(70% 30% at 50% 105%, rgba(255,138,76,.22), transparent 70%); }
#shareCard > * { position: relative; }
.sc-eyebrow { font-size: 22px; letter-spacing: .16em; text-transform: uppercase; color: var(--text-secondary); font-weight: 600; display: flex; gap: 14px; align-items: center; }
.sc-title { font-family: var(--font-display); font-size: 140px; line-height: .9; letter-spacing: -.045em; margin: 22px 0 6px; font-weight: 700; }
.sc-sub { font-size: 30px; color: var(--text-secondary); }
.sc-hero { margin-top: 34px; }
.sc-hero .n { font-family: var(--font-display); font-size: 140px; font-weight: 700; letter-spacing: -.05em; line-height: .95; }
.sc-hero .l { font-size: 28px; color: var(--text-secondary); margin-top: 8px; }
.sc-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 20px; margin-top: 34px; }
.sc-tile { background: rgba(31,28,41,.85); border: 1px solid var(--border); border-radius: 22px; padding: 26px; }
.sc-tile .n { font-family: var(--font-display); font-size: 54px; font-weight: 700; letter-spacing: -.03em; }
.sc-tile .l { font-size: 20px; color: var(--text-muted); margin-top: 4px; }
.sc-top { margin-top: 26px; display: flex; flex-direction: column; gap: 14px; }
.sc-top .r { display: flex; justify-content: space-between; font-size: 28px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
.sc-top .r span:first-child { display: flex; gap: 16px; align-items: center; }
.sc-foot { margin-top: auto; display: flex; justify-content: space-between; align-items: center; font-size: 20px; color: var(--text-muted); padding-top: 22px; }
.sc-foot b { color: var(--text-primary); }
.sc-mono { width: 52px; height: 52px; border-radius: 14px; display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; color: #1a0b12; background: linear-gradient(135deg, var(--sun-1), var(--sun-2) 55%, var(--sun-3)); font-size: 22px; flex: none; }

main.nodata > section:not(:first-child), main.nodata > div, main.nodata #platforms { display: none; }
.print-credit { display: none; }
@media print {
  #noticeModal { display: none !important; }
  @page { size: A4 landscape; margin: 8mm 8mm 14mm; }
  html { zoom: .72; }
  html, body { background: var(--bg) !important; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .topbar, .modal, .skip, #rangeSeg, #metricSeg, .btn, .author .controls, .seg { display: none !important; }
  .print-credit { display: flex !important; position: fixed; left: 0; right: 0; bottom: 0; justify-content: space-between; font-size: 12px; color: var(--text-secondary); padding: 8px 14px; background: var(--surface-1); border-top: 1px solid var(--border); max-width: none; }
  .hero { padding: 10px 0 18px; } section { padding: 8px 0; }
  .panel, .kpi, .plat { break-inside: avoid; }
  .hero .wrap { grid-template-columns: 1.15fr 1fr !important; }
  .grid2 { grid-template-columns: 1.6fr 1fr !important; }
  .kpis { grid-template-columns: repeat(4, 1fr) !important; }
  .platforms { grid-template-columns: repeat(2, 1fr) !important; }
  .itip, .info { display: none !important; }
  .videos { grid-template-columns: repeat(4, 1fr) !important; }
  .chart { height: 260px !important; } .panel.flex .chart { min-height: 260px; }
  .wrap { max-width: none; padding: 0 14px; }
  .method { break-before: page; }
}
@media (max-width: 1000px) {
  .hero .wrap, .grid2 { grid-template-columns: minmax(0, 1fr); }
  .kpis, .kpis.four { grid-template-columns: repeat(2, 1fr); }
  .platforms { grid-template-columns: 1fr; }
  .grid2.even { grid-template-columns: 1fr; }
  .videos { grid-template-columns: repeat(2, 1fr); }
  .byline { display: none; }
}
@media (max-width: 560px) {
  .wrap { padding: 0 14px; }
  /* topo: 1.ª linha = marca + língua + descarregar; 2.ª = Mundo/Portugal/Em português. Não fica fixo (liberta o ecrã). */
  .topbar { position: static; }
  .topbar .wrap { padding-top: 8px; padding-bottom: 8px; gap: 8px; min-height: 0; }
  .controls { display: contents; }
  .brand { order: 1; margin-right: auto; font-size: 15px; gap: 8px; } .brand .logo { width: 26px; height: 26px; font-size: 14px; }
  #langSeg { order: 2; } #langSeg button { padding: 5px 9px; font-size: 12px; }
  #openCard { order: 3; padding: 7px 11px; font-size: 12px; }
  #scopeSeg { order: 4; flex: 1 1 100%; } #scopeSeg button { flex: 1; padding: 7px 2px; font-size: 12.5px; }
  .secnav a { padding: 9px 10px 8px; font-size: 13px; }
  /* topo da página (hero) */
  .hero { padding: 22px 0 26px; }
  h1 { font-size: 60px; margin: 12px 0 8px; }
  .lead { font-size: 15px; }
  .hero-now { gap: 12px 22px; margin-top: 18px; }
  .hero-now .big { font-size: 38px; }
  .hero-now .lbl { font-size: 12px; }
  .hp { padding: 10px; gap: 10px; } .hp-v b { font-size: 15px; } .hp-t { font-size: 12px; }
  .ht-item { font-size: 12.5px; padding: 3px 9px 3px 3px; } .ht-n { max-width: 96px; }
  .scope-note, .src-note { font-size: 12px; }
  .src { gap: 8px; flex-wrap: nowrap; } .src > span:first-child { display: none; }
  .src .seg { min-width: 0; } #srcSeg button { padding: 6px 8px; font-size: 12.5px; }
  .hero-meta { gap: 8px; font-size: 12px; } .visitors { padding: 3px 9px; }
  .hero-chart { padding: 16px; } .hero-chart .chart { height: 180px; }
  .hero .wrap > div { min-width: 0; }
}
@media (max-width: 400px) {
  .brand { font-size: 13.5px; } .brand > span:nth-child(2) { white-space: nowrap; }
  #openCard { padding: 7px 9px; font-size: 11.5px; }
  #langSeg button { padding: 5px 7px; }
  #scopeSeg button { font-size: 12px; }
  h1 { font-size: 52px; }
  .hero-now .big { font-size: 34px; }
  .topbar .secnav .wrap { padding-top: 0; padding-bottom: 0; }
  .who .n { overflow: hidden; } .who .n .tag:not(.pt) { display: none; }
  .row { grid-template-columns: 22px 32px minmax(0, 1fr) auto; gap: 10px; }
  .kpi .value { font-size: 28px; }
  .videos { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
</style>
</head>
<body>

<a class="skip" href="#agora" data-i="skip"></a>
<div class="topbar">
  <div class="wrap">
    <a class="brand" href="./"><span class="logo">🌴</span><span>GTA VI · Live Tracker</span><span class="byline" id="byline"></span></a>
    <div class="controls">
      <div class="seg" role="group" aria-label="Vista" id="scopeSeg">
        <button data-scope="global">🌍 <span data-i="scope_global"></span></button>
        <button data-scope="portugal">🇵🇹 <span data-i="scope_portugal"></span></button>
        <button data-scope="luso">🗣️ <span data-i="scope_luso"></span></button>
      </div>
      <div class="seg" role="group" aria-label="Língua" id="langSeg">
        <button data-lang="pt">PT</button><button data-lang="en">EN</button>
      </div>
      <button class="btn" id="openCard" data-i="share_btn"></button>
    </div>
  </div>
  <nav class="secnav" aria-label="Secções"><div class="wrap" id="secnav">
    <a href="#agora" data-i="nav_now"></a><a href="#evolucao" data-i="nav_time"></a><a href="#jogos" data-i="nav_games"></a><a href="#streamers" data-i="nav_streamers"></a><a href="#youtube">YouTube</a><a href="#mais" data-i="nav_more"></a>
  </div></nav>
</div>

<header class="hero">
  <div class="wrap">
    <div>
      <div class="eyebrows"><span class="eyebrow"><i class="pulse off" id="livePulse"></i><span id="liveLabel"></span></span><span class="eyebrow record" id="recordChip"></span></div>
      <h1><span class="grad">GTA&nbsp;VI</span></h1>
      <p class="lead" data-i="lead"></p>
      <div class="hero-now">
        <div><div class="big tnum" id="heroViewers">—</div><div class="lbl" id="heroViewersLbl"></div><div class="delta" id="heroDelta" hidden></div></div>
        <div><div class="big tnum" id="heroStreams">—</div><div class="lbl" data-i="hero_streams"></div></div>
      </div>
      <div class="hero-pt" id="heroPt"></div>
      <div class="hero-top" id="heroTop" hidden></div>
      <p class="scope-note" id="scopeNote"></p>
      <div class="src"><span data-i="src_label"></span><div class="seg" role="group" aria-label="Fonte" id="srcSeg"><button data-src="twitch"></button><button data-src="kick"></button><button data-src="all"></button></div><span class="info-slot" data-info="src"></span></div>
      <p class="src-note" id="srcNote"></p>
      <div class="hero-meta"><span id="heroSub"></span><span class="visitors" id="visitors" hidden></span></div>
    </div>
    <div class="hero-chart panel" aria-live="polite">
      <div class="hc-head"><span id="hcTitle"></span><span id="hcPeak"></span></div>
      <div class="chart sm"><canvas id="heroChart" aria-label="Last 24 hours"></canvas></div>
    </div>
  </div>
</header>

<div class="print-credit wrap" id="printCredit"></div>
<main class="wrap">
  <section id="agora">
    <div class="card-head" style="align-items:flex-end"><div><h2 id="nowTitle"></h2><p class="insight" id="nowSub"></p></div><div class="notices" id="statusChips"></div></div>
    <div class="platforms" id="platforms"></div>
    <div class="kpis" id="kpis"></div>
  </section>

  <div id="buyTop"></div>
  <div id="mountF24"></div>

  <section id="evolucao">
    <div class="card-head" style="align-items:flex-end">
      <div><h2 id="tsH2"></h2></div>
      <div class="controls">
        <div class="seg" id="metricSeg"><button data-metric="v" data-i="m_viewers"></button><button data-metric="s" data-i="m_streams"></button></div>
        <div class="seg" id="rangeSeg"><button data-range="24">24h</button><button data-range="48">48h</button><button data-range="168">7d</button><button data-range="720" data-i="r_month"></button><button data-range="all" data-i="all"></button></div>
      </div>
    </div>
    <p class="insight" id="tsInsight"></p>
    <div class="grid2">
      <div class="panel flex">
        <div class="legend" id="tsLegend"></div>
        <div class="chart"><canvas id="tsChart" aria-label="Espectadores ao longo do tempo"></canvas></div>
      </div>
      <div class="panel">
        <div class="card-head"><div><h3 id="boardTitle"></h3><div class="desc" id="boardDesc"></div></div></div>
        <div class="board" id="board"></div>
      </div>
    </div>
    <div class="grid2 fc-row" id="secForecast">
      <div class="panel"><h3 data-i="fc_title"></h3><p class="insight" id="fcInsight" style="margin-bottom:0"></p></div>
      <div class="panel"><h3 data-i="fc_track"></h3><div class="desc" data-i="fc_track_desc"></div><div id="fcTable"></div></div>
    </div>
    <div class="panel flowp">
      <div class="card-head"><div><h3><span id="flowT"></span><span class="info-slot" data-info="flow"></span></h3><div class="desc" id="flowD"></div></div><div class="legend" id="flowLegend"></div></div>
      <div class="flow-grid">
        <div class="flow-side" id="flowSide"></div>
        <div class="chart sm"><canvas id="flowChart" aria-label="Streams a entrar e a sair"></canvas></div>
      </div>
      <p class="insight" id="flowInsight" style="margin:10px 0 0"></p>
    </div>
  </section>

  <div id="mountGames"></div>
  <div id="mountStreamers"></div>

  <section id="youtube">
    <h2 id="ytH2">YouTube</h2>
    <p class="insight" id="ytSub"></p>
    <div class="kpis four" id="ytKpis"></div>
    <div class="grid2 even" style="margin-top:12px">
      <div class="panel">
        <h3 id="ytLiveT"></h3><div class="desc" id="ytLiveD"></div>
        <div class="chart sm"><canvas id="ytLive" aria-label="YouTube"></canvas></div>
      </div>
      <div class="panel"><h3 id="ytBoardT"></h3><div class="board" id="ytBoard"></div></div>
    </div>
    <p class="disc" id="ytDisc"></p>
    <div class="panel" style="margin-top:12px">
      <h3 id="vidTitle"></h3><div class="desc" id="vidDesc"></div>
      <div class="videos" id="videos"></div>
    </div>
  </section>

  <div id="mountMore"></div>

  <div id="mountInsights"></div>

  <section id="sobre">
    <div class="panel"><h3 data-i="method_title" style="margin-bottom:8px"></h3><div class="method" id="method"></div></div>
    <div class="panel author">
      <div class="who2"><div class="mono">DR</div><div><div class="nm" id="authorName"></div><div class="rl" data-i="author_role"></div></div></div>
      <div class="controls"><a class="btn ghost" id="authorLink" target="_blank" rel="noopener">LinkedIn</a><button class="btn ghost" id="printBtn" data-i="pdf"></button><button class="btn ghost" id="embedBtn" data-i="embed"></button></div>
    </div>
  </section>
</main>
<footer><div class="wrap" id="footer"></div></footer>

<div class="modal" id="noticeModal" role="dialog" aria-modal="true" aria-labelledby="noticeTitle"><div class="notice-box"><h3 id="noticeTitle"></h3><p id="noticeText"></p><div class="modal-actions" style="justify-content:flex-end"><button class="btn" id="noticeOk"></button></div></div></div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="Imagem para partilhar">
  <div class="modal-inner">
    <div class="card-scale" id="cardScale"><div id="shareCard"></div></div>
    <div class="modal-actions">
      <button class="btn" id="dlCard" data-i="download"></button>
      <button class="btn ghost" id="pdfFromModal" data-i="pdf"></button>
      <button class="btn ghost" id="closeCard" data-i="close"></button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script src="extras.js"></script>
</body>
</html>
