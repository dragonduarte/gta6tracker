name: Recolha GTA VI

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Buscar dados anteriores
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git checkout FETCH_HEAD -- public/data data 2>/dev/null || true
            git reset -q
          fi
      - name: Recolher
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
          KICK_CLIENT_ID: ${{ secrets.KICK_CLIENT_ID }}
          KICK_CLIENT_SECRET: ${{ secrets.KICK_CLIENT_SECRET }}
          KICK_CATEGORY_ID: ${{ secrets.KICK_CATEGORY_ID }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          FORCE_YT_VIDEOS: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: node scripts/collect.js
      - name: Guardar no branch data
        run: |
          git config user.name "gta6-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -q --orphan data-tmp
          git rm -rfq --cached . > /dev/null
          git add -f public/data data
          git commit -qm "dados $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3; do git push -qf origin HEAD:data && break; sleep 5; done
